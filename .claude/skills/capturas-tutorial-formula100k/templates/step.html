<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_tokens.css">
<style>
.step-card {
  display: flex;
  align-items: flex-start;
  gap: 32px;
  max-width: 880px;
  padding: 40px 48px;
}
.step-num {
  flex-shrink: 0;
  width: 88px;
  height: 88px;
  border-radius: 50%;
  background: var(--coral);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-style: italic;
  font-size: 48px;
  color: #fff;
  box-shadow: var(--shadow-card);
}
.step-body { padding-top: 4px; }
.step-title {
  font-family: var(--font-display);
  font-style: italic;
  font-size: 44px;
  font-weight: 400;
  line-height: 1.15;
  color: var(--ink);
  margin-bottom: 14px;
}
.step-text {
  font-family: var(--font-body);
  font-size: 22px;
  line-height: 1.45;
  color: var(--ink-soft);
  font-weight: 400;
}
.step-text strong { font-weight: 700; color: var(--ink); }
.step-text code {
  font-family: var(--font-mono);
  font-size: 19px;
  background: var(--gray-soft);
  padding: 2px 8px;
  border-radius: 4px;
}
</style>
</head>
<body data-bg="{{bg}}">
<div class="stage" data-bg="{{bg}}">
  <div class="step-card">
    <div class="step-num">{{number}}</div>
    <div class="step-body">
      <h2 class="step-title">{{title}}</h2>
      <p class="step-text">{{body}}</p>
    </div>
  </div>
</div>
</body>
</html>
